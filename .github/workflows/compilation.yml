name: Zibu - recopilatorio semanal

# Cada sabado: junta 6 episodios que aun no han salido en un recopilatorio (~1 hora) y lo sube a cada canal.
# Casi la mitad de las vistas en espanol y portugues son en TV, donde se deja puesto un video largo.
# Los episodios se vuelven a renderizar (Kokoro, gratis) en paralelo; repo publico = minutos de Actions ilimitados.
on:
  schedule:
    - cron: '17 7 * * 6'
  workflow_dispatch:
    inputs:
      langs:
        description: 'Idiomas separados por comas'
        default: 'es,pt'
      n:
        description: 'Episodios por recopilatorio'
        default: '6'
      upload:
        description: 'Subir a YouTube'
        type: boolean
        default: true

concurrency:
  group: zibu-compilation
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.p.outputs.items }}
      langs: ${{ steps.p.outputs.langs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          items=$(python scripts/compilation.py plan "${{ inputs.langs || 'es,pt' }}" "${{ inputs.n || '6' }}")
          echo "items=$items" >> "$GITHUB_OUTPUT"
          echo "langs=$(echo "$items" | python -c 'import json,sys; print(json.dumps(sorted({x["lang"] for x in json.load(sys.stdin)})))')" >> "$GITHUB_OUTPUT"
          echo "$items"

  render:
    needs: plan
    if: needs.plan.outputs.items != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.items) }}
    env:
      EP: ${{ matrix.ep }}
      LG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install kokoro-onnx soundfile numpy requests mutagen
      - run: npm ci
      - name: Modelo de voz (Kokoro)
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f "models/$f" ] || curl -sSL -o "models/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
      - name: Traducir al portugues de Brasil
        if: matrix.lang == 'pt'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Gemini a veces devuelve la traduccion a medias: hasta 3 intentos antes de dar el episodio por perdido
          for i in 1 2 3; do python scripts/translate_pt.py "stories/$EP.json" && exit 0; echo "intento $i fallido"; sleep 45; done
          exit 1
      - name: Voces, musica y timeline con Kokoro (sin gastar creditos de ElevenLabs)
        run: python scripts/build_episode.py "stories/$EP.json" "$LG"
      - name: Video, miniatura y datos
        run: |
          npx remotion render Episode "out/$EP-$LG.mp4" --props="{\"episode\":\"$EP\",\"lang\":\"$LG\"}" --log=error
          npx remotion still Thumbnail "out/$EP-$LG.png" --props="{\"episode\":\"$EP\",\"lang\":\"$LG\"}" --log=error
          python scripts/compilation.py meta "$EP" "$LG"
      - uses: actions/upload-artifact@v4
        with:
          name: comp-${{ matrix.lang }}-${{ matrix.ep }}
          path: out/${{ matrix.ep }}-${{ matrix.lang }}.*
          retention-days: 2

  join:
    needs: [plan, render]
    if: always() && needs.plan.outputs.items != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1          # cada uno sube y apunta su recopilatorio (stories/compilations/)
      matrix:
        lang: ${{ fromJSON(needs.plan.outputs.langs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install pillow requests google-api-python-client google-auth
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: comp-${{ matrix.lang }}-*
          path: out
          merge-multiple: true
      - name: Unir y subir
        env:
          DRY_RUN:          ${{ (github.event_name == 'schedule' || inputs.upload) && '0' || '1' }}
          OPENAI_IMAGE_KEY: ${{ secrets.OPENAI_IMAGE_KEY }}   # miniatura con IA
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}     # comprueba el titulo de la miniatura
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_EN:    ${{ secrets.YT_REFRESH_EN }}
          YT_REFRESH_ES:    ${{ secrets.YT_REFRESH_ES }}
          YT_REFRESH_PT:    ${{ secrets.YT_REFRESH_PT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/compilation.py join "${{ matrix.lang }}"
      - name: Guardar el registro
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stories/compilations 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Recopilatorio ${{ matrix.lang }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compilation-${{ matrix.lang }}
          path: out/compilation-${{ matrix.lang }}.*
          retention-days: 3
          if-no-files-found: ignore

  aviso-fallo:
    needs: [plan, render, join]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ Zibu: algo del recopilatorio ha fallado. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
