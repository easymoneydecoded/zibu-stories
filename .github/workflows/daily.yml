name: Zibu - episodio diario

# Cada dia: Gemini escribe un guion nuevo -> se renderiza en ingles, espanol y portugues (en paralelo; el portugues
# se traduce del guion aprobado) -> se sube a @ZibuAndFriendsEnglish, @ZibuYSusAmigos y Zibu e seus amigos + aviso por Telegram.
# Repo publico: los minutos de Actions son gratis e ilimitados.
on:
  schedule:
    # 9:23 UTC: GitHub retrasa mas los crons en punto, y a esta hora Gemini (gratis) va menos saturado
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episodio ya escrito (p. ej. ep002-...). Vacio = escribir uno nuevo'
        default: ''
      upload:
        description: 'Subir a YouTube'
        type: boolean
        default: true
      auto:
        description: 'Lanzado por el despertador de Cloudflare: no hace nada si hoy ya hay episodio'
        type: boolean
        default: false

concurrency:
  group: zibu-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  story:
    runs-on: ubuntu-latest
    outputs:
      episode: ${{ steps.pick.outputs.episode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Guion
        id: pick
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ inputs.episode }}" ]; then
            echo "episode=${{ inputs.episode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Automatico (cron de GitHub o despertador de Cloudflare): un solo episodio al dia aunque lleguen los dos
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; then
            if python -c "import json,datetime,sys; l=json.load(open('stories/ledger.json')); sys.exit(0 if any(x['date']==datetime.date.today().isoformat() for x in l) else 1)"; then
              echo "Hoy ya hay episodio: no se hace otro"
              exit 0
            fi
          fi
          python scripts/generate_story.py
      - name: Guardar el guion en el repo
        if: inputs.episode == '' && steps.pick.outputs.episode != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add stories/
          git commit -m "Guion: ${{ steps.pick.outputs.episode }}"
          git push
      - name: Imagen de IA para la miniatura (una para los 3 idiomas; si falla, la de siempre)
        if: steps.pick.outputs.episode != ''
        env:
          GEMINI_IMAGE_KEY: ${{ secrets.GEMINI_IMAGE_KEY }}
          OPENAI_IMAGE_KEY: ${{ secrets.OPENAI_IMAGE_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}     # gratis: comprueba que el titulo dibujado este bien escrito
          EP: ${{ steps.pick.outputs.episode }}
        run: |
          git pull -q || true
          pip install pillow
          python scripts/ai_thumb.py "stories/$EP.json" || true
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.episode != ''
        with:
          name: thumb-ai
          path: |
            public/ep/${{ steps.pick.outputs.episode }}/thumb-ai.png
            public/ep/${{ steps.pick.outputs.episode }}/thumb-ai-*.png
          retention-days: 3
          if-no-files-found: ignore

  render:
    needs: story
    if: needs.story.outputs.episode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        lang: [en, es, pt]
    env:
      EP: ${{ needs.story.outputs.episode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}      # incluye el guion recien guardado
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install kokoro-onnx soundfile numpy requests mutagen google-api-python-client google-auth
      - run: npm ci
      - name: Modelo de voz (Kokoro)
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f "models/$f" ] || curl -sSL -o "models/$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
      - name: Imagen de IA de la miniatura (si se hizo)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: thumb-ai
          path: public/ep/${{ env.EP }}
      - name: Traducir al portugues de Brasil
        if: matrix.lang == 'pt'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Gemini a veces devuelve la traduccion a medias: hasta 3 intentos antes de dar el episodio por perdido
          for i in 1 2 3; do python scripts/translate_pt.py "stories/$EP.json" && exit 0; echo "intento $i fallido"; sleep 45; done
          exit 1
      - name: Titulo de la miniatura en portugues (la imagen base ya esta hecha)
        if: matrix.lang == 'pt'
        env:
          OPENAI_IMAGE_KEY: ${{ secrets.OPENAI_IMAGE_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install pillow
          python scripts/ai_thumb.py "stories/$EP.json" --text pt || true
      - name: Voces, musica y timeline
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}   # espanol con ElevenLabs mientras queden creditos
        run: python scripts/build_episode.py "stories/$EP.json" ${{ matrix.lang }}
      - name: Video y miniatura
        run: |
          npx remotion render Episode "out/$EP-${{ matrix.lang }}.mp4" --props="{\"episode\":\"$EP\",\"lang\":\"${{ matrix.lang }}\"}" --log=error
          # Miniatura: la de IA con el titulo dibujado (comprobado); si no, la de IA con el texto puesto por codigo;
          # si no, la de siempre
          if [ -f "public/ep/$EP/thumb-ai-${{ matrix.lang }}.png" ]; then
            cp "public/ep/$EP/thumb-ai-${{ matrix.lang }}.png" "out/$EP-${{ matrix.lang }}.png"
          else
            THUMB=Thumbnail; [ -f "public/ep/$EP/thumb-ai.png" ] && THUMB=AIThumb
            npx remotion still $THUMB "out/$EP-${{ matrix.lang }}.png" --props="{\"episode\":\"$EP\",\"lang\":\"${{ matrix.lang }}\"}" --log=error
          fi
      - name: Subir a YouTube
        if: github.event_name == 'schedule' || inputs.upload  # en el cron de GitHub los inputs son nulos (y nulo == false)
        env:
          YT_CLIENT_ID:       ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:   ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_EN:      ${{ secrets.YT_REFRESH_EN }}
          YT_REFRESH_ES:      ${{ secrets.YT_REFRESH_ES }}
          YT_REFRESH_PT:      ${{ secrets.YT_REFRESH_PT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/upload.py "$EP" ${{ matrix.lang }}
      - name: Guardar el video (3 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EP }}-${{ matrix.lang }}
          path: out/${{ env.EP }}-${{ matrix.lang }}.*
          retention-days: 3
          if-no-files-found: ignore

  aviso-fallo:
    needs: [story, render]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="⚠️ Zibu: el episodio de hoy ha fallado. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
